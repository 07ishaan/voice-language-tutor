<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10141c">
    <title>Voice Language Tutor</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; --bg:#10141c; --panel:#191f2a; --line:#303a49; --text:#edf1f7; --muted:#a8b2c1; --accent:#9ab4ff; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); }
      button, textarea { font:inherit; }
      button { border:0; border-radius:10px; padding:.65rem .9rem; color:#101725; background:var(--accent); font-weight:700; cursor:pointer; }
      button:disabled { opacity:.55; cursor:wait; }
      .app { min-height:100vh; display:grid; grid-template-rows:auto 1fr auto; max-width:1000px; margin:auto; padding:0 1rem; }
      header { display:flex; align-items:center; gap:.9rem; padding:1rem 0; border-bottom:1px solid var(--line); }
      .avatar { display:grid; place-items:center; width:44px; height:44px; border-radius:50%; background:#293754; color:#cddaff; font-weight:800; }
      h1 { margin:0; font-size:1.1rem; }
      header p { margin:.1rem 0 0; color:var(--muted); font-size:.9rem; }
      .header-spacer { flex:1; }
      .quiet { color:var(--muted); background:transparent; border:1px solid var(--line); }
      #messages { overflow:auto; padding:1.5rem 0; display:flex; flex-direction:column; gap:1rem; }
      .welcome { margin:auto; max-width:520px; padding:2rem 1rem; text-align:center; color:var(--muted); }
      .welcome h2 { color:var(--text); font-size:1.35rem; }
      .message { max-width:min(760px,92%); padding:.85rem 1rem; border:1px solid var(--line); border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
      .message.user { align-self:flex-end; background:#263550; border-color:#354968; }
      .message.assistant { align-self:flex-start; background:var(--panel); }
      .speaker { margin:0 0 .3rem; color:var(--muted); font-size:.78rem; font-weight:700; }
      .target { margin:0; }
      .translation-details { margin-top:.65rem; color:#c0c9d6; font-size:.92rem; }
      .translation-details summary { color:var(--muted); cursor:pointer; }
      .translation { margin:.45rem 0 0; padding-top:.45rem; border-top:1px solid var(--line); }
      .message-tools { display:flex; gap:.5rem; margin-top:.65rem; }
      .message-tools button { padding:.35rem .65rem; font-size:.85rem; }
      audio { display:block; width:min(420px,100%); margin-top:.65rem; }
      audio[hidden] { display:none; }
      footer { padding:.8rem 0 1rem; border-top:1px solid var(--line); }
      .settings { display:flex; flex-wrap:wrap; gap:1rem; margin:.1rem 0 .7rem; color:var(--muted); font-size:.85rem; }
      .settings label { display:flex; align-items:center; gap:.45rem; }
      .settings select { color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:.25rem .4rem; font:inherit; }
      .composer { display:flex; align-items:flex-end; gap:.55rem; padding:.55rem; border:1px solid #3b4657; border-radius:14px; background:var(--panel); }
      textarea { flex:1; min-height:48px; max-height:160px; resize:vertical; border:0; outline:0; padding:.55rem; background:transparent; color:var(--text); }
      #mic { color:var(--text); background:#2a3342; border:1px solid var(--line); }
      #mic.listening { background:#773b4b; }
      #status { min-height:1.4em; margin:.4rem .3rem 0; color:var(--muted); font-size:.82rem; }
      @media(max-width:560px) { .app{padding:0 .7rem} .message{max-width:98%} .settings{gap:.5rem 1rem} #mic{padding:.65rem} }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="avatar" id="avatar" aria-hidden="true">T</div>
        <div><h1 id="title">Voice Language Tutor</h1><p id="subtitle">Connecting to your tutor…</p></div>
        <div class="header-spacer"></div>
        <button class="quiet" id="clear" type="button" title="Clear this conversation">New chat</button>
      </header>
      <main id="messages" aria-live="polite" aria-label="Conversation">
        <section class="welcome" id="welcome"><h2>Start a conversation</h2><p id="welcome-copy">Type a message or use the microphone. Your tutor will reply in your target language.</p></section>
      </main>
      <footer>
        <div class="settings">
          <label><input id="auto-voice" type="checkbox" checked> Speak replies automatically</label>
          <label><input id="send-after-speech" type="checkbox"> Send recognized speech automatically</label>
          <label for="conversation-language">Conversation language
            <select id="conversation-language" aria-label="Conversation language"></select>
          </label>
          <label for="learner-level">Level
            <select id="learner-level" aria-label="Language proficiency level"></select>
          </label>
          <label for="response-length">Reply length
            <select id="response-length" aria-label="Reply length">
              <option value="short">Short</option>
              <option value="normal" selected>Normal</option>
              <option value="detailed">Detailed</option>
            </select>
          </label>
        </div>
        <form class="composer" id="form">
          <button id="mic" type="button" aria-label="Use microphone" title="Speak a message">🎙</button>
          <textarea id="input" rows="1" placeholder="Write a message…" aria-label="Your message"></textarea>
          <button id="send" type="submit">Send</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </footer>
    </div>
    <script>
      const $ = (selector) => document.querySelector(selector);
      const messagesEl = $("#messages");
      const input = $("#input");
      const sendButton = $("#send");
      const micButton = $("#mic");
      const statusEl = $("#status");
      const languageSelect = $("#conversation-language");
      const levelSelect = $("#learner-level");
      const history = [];
      const audioCache = new Map();
      let config = null;
      let recognition = null;
      let busy = false;
      const appShutdownToken = new URLSearchParams(location.hash.slice(1)).get("app_shutdown");

      if (appShutdownToken) {
        window.addEventListener("pagehide", () => {
          fetch("/api/shutdown", {
            method: "POST",
            headers: { "X-Voice-Tutor-Token": appShutdownToken },
            keepalive: true,
          }).catch(() => {});
        }, { once: true });
      }

      function setStatus(text) { statusEl.textContent = text; }
      function addTextMessage(text, role) {
        $("#welcome")?.remove();
        const bubble = document.createElement("article");
        bubble.className = `message ${role}`;
        const label = document.createElement("p");
        label.className = "speaker";
        label.textContent = role === "user" ? "You" : (config?.name || "Tutor");
        const body = document.createElement("p");
        body.className = "target";
        body.textContent = text;
        bubble.append(label, body);
        messagesEl.append(bubble);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return bubble;
      }
      function appendTutorReply(reply, languageCode) {
        const bubble = addTextMessage(reply.target, "assistant");
        if (reply.native) {
          const details = document.createElement("details");
          details.className = "translation-details";
          const summary = document.createElement("summary");
          summary.textContent = "Show English translation";
          const note = document.createElement("p");
          note.className = "translation";
          note.textContent = reply.native;
          details.append(summary, note);
          bubble.append(details);
        }
        const controls = document.createElement("div");
        controls.className = "message-tools";
        const speak = document.createElement("button");
        speak.className = "quiet";
        speak.type = "button";
        speak.textContent = "Play voice";
        const regenerate = document.createElement("button");
        regenerate.className = "quiet";
        regenerate.type = "button";
        regenerate.textContent = "Regenerate audio";
        const player = document.createElement("audio");
        player.controls = true;
        player.hidden = true;
        const audioState = { url:null, player, speak, regenerate, loading:false, languageCode };
        audioCache.set(bubble, audioState);
        speak.addEventListener("click", () => speakReply(reply.target, bubble));
        regenerate.addEventListener("click", () => speakReply(reply.target, bubble, true));
        controls.append(speak, regenerate);
        bubble.append(controls, player);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        if ($("#auto-voice").checked) speakReply(reply.target, bubble);
      }
      async function speakReply(text, bubble, regenerate = false) {
        const audioState = audioCache.get(bubble);
        if (!audioState || audioState.loading) return;
        const { player, speak, regenerate: regenerateButton } = audioState;
        if (audioState.url && !regenerate) {
          player.currentTime = 0;
          try { await player.play(); setStatus("Playing cached tutor audio."); }
          catch { setStatus("Audio is ready. Press Play on the audio control."); }
          return;
        }
        audioState.loading = true;
        speak.disabled = true;
        regenerateButton.disabled = true;
        speak.textContent = audioState.url ? "Play voice" : "Preparing voice…";
        regenerateButton.textContent = regenerate ? "Regenerating…" : "Regenerate audio";
        try {
          const response = await fetch("/api/tts", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, language_code:audioState.languageCode }),
          });
          if (!response.ok) throw new Error(await response.text() || `Voice request failed (${response.status})`);
          const audioUrl = URL.createObjectURL(await response.blob());
          const previousUrl = audioState.url;
          player.pause();
          player.src = audioUrl;
          player.hidden = false;
          player.load();
          audioState.url = audioUrl;
          if (previousUrl) URL.revokeObjectURL(previousUrl);
          try { await player.play(); setStatus("Playing tutor reply."); }
          catch { setStatus("Audio is ready. Press Play on the audio control."); }
          speak.textContent = "Play voice";
        } catch (error) {
          setStatus(`Voice error: ${error.message}`);
          if (!audioState.url) speak.textContent = "Retry voice";
        } finally {
          audioState.loading = false;
          speak.disabled = false;
          regenerateButton.disabled = false;
          regenerateButton.textContent = "Regenerate audio";
        }
      }
      async function sendMessage(text) {
        text = text.trim();
        if (!text || busy) return;
        const languageCode = languageSelect.value || config?.language_code || "ja";
        const learnerLevel = levelSelect.value || config?.learner_level || "N5";
        busy = true;
        sendButton.disabled = true;
        micButton.disabled = true;
        input.value = "";
        addTextMessage(text, "user");
        history.push({ role:"user", content:text });
        setStatus(`${config?.name || "Tutor"} is thinking…`);
        try {
          const response = await fetch("/api/chat", {
            method:"POST", headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({
              history,
              response_length:$("#response-length").value,
              language_code:languageCode,
              learner_level:learnerLevel,
            }),
          });
          const reply = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(reply.detail || `Chat request failed (${response.status})`);
          if (!reply.target) throw new Error("The tutor returned an empty reply.");
          history.push({ role:"assistant", content:reply.target });
          appendTutorReply(reply, languageCode);
          setStatus("Reply received.");
        } catch (error) {
          history.pop();
          setStatus(`Chat error: ${error.message}`);
        } finally {
          busy = false;
          sendButton.disabled = false;
          micButton.disabled = !recognition;
          input.focus();
        }
      }
      $("#form").addEventListener("submit", (event) => { event.preventDefault(); sendMessage(input.value); });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("#form").requestSubmit(); }
      });
      $("#clear").addEventListener("click", () => {
        for (const audioState of audioCache.values()) {
          audioState.player.pause();
          if (audioState.url) URL.revokeObjectURL(audioState.url);
        }
        audioCache.clear();
        history.length = 0;
        messagesEl.replaceChildren();
        const welcome = document.createElement("section");
        welcome.className = "welcome";
        welcome.innerHTML = "<h2>Start a conversation</h2><p></p>";
        welcome.querySelector("p").textContent = config?.empty_text || "Type a message or use the microphone.";
        messagesEl.append(welcome);
        setStatus("Conversation cleared.");
      });

      function getLanguage(code) {
        return config?.languages?.find((language) => language.code === code) || {
          code: "ja", name: "Japanese", stt: "ja-JP",
        };
      }
      function populateLevels(languageCode, useCharacterDefault = false) {
        const choices = languageCode === "ja"
          ? [["N5", "N5 · Beginner"], ["N4", "N4 · Elementary"], ["N3", "N3 · Intermediate"], ["N2", "N2 · Upper intermediate"], ["N1", "N1 · Advanced"]]
          : [["A1", "A1 · Beginner"], ["A2", "A2 · Elementary"], ["B1", "B1 · Intermediate"], ["B2", "B2 · Upper intermediate"], ["C1", "C1 · Advanced"], ["C2", "C2 · Proficient"]];
        levelSelect.replaceChildren(...choices.map(([value, label]) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          return option;
        }));
        const saved = localStorage.getItem(`tutor-level-${languageCode}`);
        let initial = saved;
        if (!initial && useCharacterDefault) {
          const levelText = (config?.learner_level || "").toUpperCase();
          initial = choices.find(([value]) => levelText.includes(value))?.[0];
        }
        levelSelect.value = choices.some(([value]) => value === initial) ? initial : choices[0][0];
        localStorage.setItem(`tutor-level-${languageCode}`, levelSelect.value);
      }
      function updateConversationDisplay() {
        const language = getLanguage(languageSelect.value);
        const level = levelSelect.value;
        $("#subtitle").textContent = `${config.native_language} → ${language.name} · ${level}`;
        input.placeholder = `Write in ${language.name}…`;
      }
      languageSelect.addEventListener("change", () => {
        populateLevels(languageSelect.value);
        localStorage.setItem("tutor-language", languageSelect.value);
        updateConversationDisplay();
        setStatus(`New replies will be in ${getLanguage(languageSelect.value).name}.`);
      });
      levelSelect.addEventListener("change", () => {
        localStorage.setItem(`tutor-level-${languageSelect.value}`, levelSelect.value);
        updateConversationDisplay();
        setStatus(`New replies will use ${levelSelect.value} level.`);
      });

      fetch("/api/config")
        .then(async (response) => { if (!response.ok) throw new Error(`Settings request failed (${response.status})`); return response.json(); })
        .then((data) => {
          config = data;
          document.title = data.title || "Voice Language Tutor";
          $("#title").textContent = data.title || "Voice Language Tutor";
          $("#avatar").textContent = (data.name || "T").trim().slice(0,1).toUpperCase();
          languageSelect.replaceChildren(...data.languages.map((language) => {
            const option = document.createElement("option");
            option.value = language.code;
            option.textContent = language.name;
            return option;
          }));
          const savedLanguage = localStorage.getItem("tutor-language");
          languageSelect.value = data.languages.some((language) => language.code === savedLanguage)
            ? savedLanguage : data.language_code;
          populateLevels(languageSelect.value, languageSelect.value === data.language_code);
          updateConversationDisplay();
          $("#welcome-copy").textContent = data.empty_text || "Type a message or use the microphone.";
        })
        .catch((error) => { $("#subtitle").textContent = "Could not load tutor settings"; setStatus(error.message); });

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.interimResults = false;
        recognition.continuous = false;
        recognition.onstart = () => { micButton.classList.add("listening"); setStatus("Listening…"); };
        recognition.onend = () => micButton.classList.remove("listening");
        recognition.onerror = (event) => setStatus(`Microphone error: ${event.error}. You can still type a message.`);
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript.trim();
          input.value = transcript;
          input.focus();
          if ($("#send-after-speech").checked) sendMessage(transcript);
          else setStatus("Speech recognized. Review or edit it, then send.");
        };
        micButton.addEventListener("click", () => {
          recognition.lang = getLanguage(languageSelect.value).stt || config?.stt_language || "en-US";
          try { recognition.start(); } catch { setStatus("Microphone is already listening."); }
        });
      } else {
        micButton.disabled = true;
        micButton.title = "Speech recognition is not available in this browser. You can type instead.";
      }
    </script>
  </body>
</html>
